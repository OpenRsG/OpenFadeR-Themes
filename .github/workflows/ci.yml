name: CI

# Every theme must load in the app without a note and, when it has an author, list every token: the core's own test,
# run with this repository checked out where the core finds its themes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenRsG/OpenFadeR
          path: core
      - uses: actions/checkout@v4
        with:
          path: core/extension/skin
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --manifest-path core/Cargo.toml --bin openfader the_checked_out_themes
